const FOOD_LIBRARY_STORE='qingheng-public-user-foods-v1';
FOOD_DB.push(...CHAIN_FOODS);

function normalizeFood(raw,index){
  if(!raw || typeof raw!=='object'||typeof raw.name!=='string'||raw.name.trim().length<1||raw.name.length>70)throw Error(`食品第 ${index+1} 项名称无效`);
  if(!['g','ml','个','袋','包','瓶','份','根','罐','片'].includes(raw.unit))throw Error(`食品「${raw.name}」单位无效`);
  const base=Number(raw.base); if(!Number.isFinite(base)||base<=0||base>10000)throw Error(`食品「${raw.name}」基准数量无效`);
  const id=typeof raw.id==='string'&&/^[A-Za-z0-9_-]{1,90}$/.test(raw.id)?raw.id:'import_'+index+'_'+Date.now();
  const out={id,name:raw.name.trim(),aliases:Array.isArray(raw.aliases)?raw.aliases.filter(x=>typeof x==='string'&&x.length<=30).slice(0,12):[],category:typeof raw.category==='string'?raw.category.slice(0,30):'自定义',base,unit:raw.unit,approx:raw.approx!==false};
  for(const k of ['kcal','protein','carbs','fat','fiber','sodium','potassium','calcium','vitC']){const v=raw[k];out[k]=typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=100000?v:null;}
  if(out.kcal===null)throw Error(`食品「${out.name}」缺少有效热量`);
  out.source=typeof raw.source==='string'?raw.source.slice(0,120):'用户导入';
  return out;
}
function loadUserFoods(){
 if(DEMO_MODE)return;
 try{
  const p=JSON.parse(localStorage.getItem(FOOD_LIBRARY_STORE)||'[]');
  if(!Array.isArray(p)||p.length>5000)return;
  const seen=new Set(FOOD_DB.map(f=>f.id));
  for(let i=0;i<p.length;i++){
   try{const f=normalizeFood(p[i],i);if(seen.has(f.id))continue;seen.add(f.id);FOOD_DB.push(f);}catch(e){console.warn('Skipped stored food',e)}
  }
 }catch(e){console.warn('Unable to read user food library',e)}
}
function saveUserFoods(){
 if(DEMO_MODE)return;
 const userFoods=FOOD_DB.filter(f=>f.id.startsWith('user_')||f.id.startsWith('import_'));
 localStorage.setItem(FOOD_LIBRARY_STORE,JSON.stringify(userFoods));
}
loadUserFoods();

function calcNutrition(entry){
  if(entry.custom){const out={};for(const k of FIELDS)out[k]=Number.isFinite(entry[k])?entry[k]:null;return out;}
  const food=findFood(entry.foodId);if(!food)return Object.fromEntries(FIELDS.map(k=>[k,null]));
  const factor=Number(entry.amount)/food.base * (Number.isFinite(entry.servings)?entry.servings:1) * (Number.isFinite(entry.densityPercent)?entry.densityPercent/100:1) * (Number.isFinite(entry.ediblePercent)?entry.ediblePercent/100:1);
  if(!Number.isFinite(factor)||factor<=0)return Object.fromEntries(FIELDS.map(k=>[k,null]));
  const out={};for(const k of FIELDS)out[k]=(typeof food[k]==='number') ? +((food[k]*factor).toFixed(2)) : null;
  return out;
}

      const out={id:typeof e.id==='string'?e.id:uuid(),name:e.name,meal:e.meal,foodId:e.foodId,amount:Number.isFinite(e.amount)?e.amount:1,unit:typeof e.unit==='string'?e.unit:'g',custom:!!e.custom,origin:typeof e.origin==='string'?e.origin:'导入',approx:!!e.approx,servings:Number.isFinite(e.servings)?Math.max(0,e.servings):1,densityPercent:Number.isFinite(e.densityPercent)?Math.max(1,Math.min(500,e.densityPercent)):100,ediblePercent:Number.isFinite(e.ediblePercent)?Math.max(0,Math.min(100,e.ediblePercent)):100};
      if(out.custom)for(const f of FIELDS)out[f]=Number.isFinite(e[f])?Math.max(0,e[f]):null;

    });

  }

function sums(entries){

  for(const e of entries){const v=calcNutrition(e);for(const k of FIELDS){if(v[k]===null)missing[k]++;else result[k]+=v[k];}}
  for(const k of FIELDS) result[k]=+(result[k].toFixed(1));
  return {result,missing,entryCount:entries.length};
}
function calorieTotals(day){
  const byMeal={};for(const m of MEALS){const entries=day.entries.filter(e=>e.meal===m.id); const raw=sums(entries).result.kcal;const override=day.mealOverrides?.[m.id];byMeal[m.id]={raw,display:Number.isFinite(override)?override:raw,override:Number.isFinite(override)?override:null};}
  const estimated=Object.values(byMeal).reduce((a,m)=>a+m.display,0);
  const corrected=Number.isFinite(day.calorieOverride)?day.calorieOverride:estimated;
  return {byMeal,estimated:+estimated.toFixed(1),display:+corrected.toFixed(1),override:Number.isFinite(day.calorieOverride)?day.calorieOverride:null};
}

}

function latestWeightOnOrBefore(date){

function nutritionAdvice(day,settings=DEFAULT_SETTINGS){

  if(scarce('protein'))advice.push({key:'quality',severity:'normal',title:'部分食品缺少营养标签',message:'已统计的营养数值只是下限，建议补充包装营养信息，以免误判缺乏。',action:'完善营养数据'});

  if(missing.calcium<entryCount&&result.calcium<targets.calcium[0])advice.push({key:'calcium',severity:'normal',title:'关注钙摄入',message:`已知约 ${fmt(result.calcium)} mg / ${targets.calcium[0]} mg。牛奶250 ml约可补钙300 mg，或选择有钙标签的乳品/强化豆制品。${scarce('calcium')?'部分食品钙含量尚未录入。':''}`,action:'可选纯牛奶/低糖酸奶'});
  if(missing.vitC<entryCount&&result.vitC<targets.vitC[0])advice.push({key:'vitC',severity:'normal',title:'可补充维生素 C',message:`已知约 ${fmt(result.vitC)} mg / ${targets.vitC[0]} mg；一份猕猴桃或彩椒、绿叶菜可以帮助达标。${scarce('vitC')?'仍有食品维C数据未知。':''}`,action:'参考：猕猴桃85g约78mg'});
  if(missing.potassium<entryCount&&result.potassium<targets.potassium[0])advice.push({key:'potassium',severity:'normal',title:'优先从食物获得钾',message:`已知约 ${fmt(result.potassium)} mg / ${targets.potassium[0]} mg。可从土豆、蔬菜、豆类和水果补充；不要根据此估算自行加量服用钾片。${scarce('potassium')?'部分记录不含钾数据。':''}`,action:'土豆、菠菜、豆制品'});

function quickParse(text, meal='snack'){
  const items=[];const unknown=[];let recognizedOverride=null;
  const overrideMatch=text.match(/(?:全天|总(?:热量|摄入)|今日)(?:的?(?:热量|摄入))?\s*(?:按|算|定为|记为|改成|改为)?\s*(\d{2,5})\s*(?:千卡|大卡|kcal|卡)/i);
  if(overrideMatch)recognizedOverride=Number(overrideMatch[1]);
  let txt=text.replace(/\s+/g,'').replace(/[，、＋+和跟与]/g,';').replace(/\n/g,';');
  // Expand special non-canonical phrases and chinese numerals.
  const zh={'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
  txt=txt.replace(/([一二两三四五六七八九十])(?=个|颗|袋|包|根|罐|瓶)/g,(_,v)=>String(zh[v]));
  const fragments=txt.split(/[;；。:：]/).map(s=>s.trim()).filter(Boolean);
  for(const frag of fragments){
    if(/全天|总热量|总摄入/.test(frag)&&/\d+/.test(frag))continue;
    let m=meal;
    if(/午餐|中午/.test(frag))m='lunch';else if(/晚餐|晚上|睡前/.test(frag))m='dinner';else if(/早餐|早上/.test(frag))m='breakfast';else if(/加餐|下午/.test(frag))m='snack';
    const stripped=frag.replace(/^(?:早餐|午餐|晚餐|加餐|中午|下午|晚上|睡前|早上)(?:是|吃|加|了|有|为)?/,'');
    const indexed=FOOD_DB.flatMap(f=>[f.name,...f.aliases].filter(Boolean).map(alias=>({f,alias}))).sort((a,b)=>b.alias.length-a.alias.length);
    const match=indexed.find(x=>stripped.includes(x.alias));
    if(!stripped)continue;
    if(!match){unknown.push(frag);continue;}
    const {f,alias}=match;
    const before=stripped.slice(0,stripped.indexOf(alias)),after=stripped.slice(stripped.indexOf(alias)+alias.length);
    const rx=/(\d+(?:\.\d+)?)\s*(克|g|毫升|ml|个|颗|袋|包|瓶|根|罐)/i;
    const grams=Array.from(stripped.matchAll(/(\d+(?:\.\d+)?)\s*(g|克|ml|毫升)/gi));
    // When count and weight coexist ("三个大番茄750g"), prefer gram weight.
    let picked=grams.length?grams[grams.length-1]:after.match(rx)||before.match(rx)||stripped.match(rx);
    if(!picked && (f.unit==='g'||f.unit==='ml')){unknown.push(`${frag}（请写明重量或体积）`);continue;}
    let amount=picked?Number(picked[1]):1;
    const rawUnit=picked?picked[2]:(f.unit);
    const unit=/克|g/i.test(rawUnit)?'g':/毫升|ml/i.test(rawUnit)?'ml':/个|颗/.test(rawUnit)?'个':/袋|包/.test(rawUnit)?'袋':/瓶/.test(rawUnit)?'瓶':/根/.test(rawUnit)?'根':/罐/.test(rawUnit)?'罐':f.unit;
    if(unit!==f.unit){
      if(f.unit==='g'&&unit!=='g'){
        // Only convert to grams for foods where one-piece weight was recorded.
        const pieceGram={egg_whitewater:30,kiwi:85,meat_egg:60,egg:55,beef_patty:50};
        if(!pieceGram[f.id]){unknown.push(`${frag}（请用克数）`);continue;}
        amount*=pieceGram[f.id];
      }else if(f.unit==='ml'&&unit==='瓶'&&f.id==='tomato_juice')amount*=220;
      else if(f.unit==='ml'&&unit==='瓶'&&f.id==='green_juice')amount*=220;
      else if(f.unit!=='g'&&f.unit!=='ml'&&unit!==f.unit){unknown.push(`${frag}（单位不匹配）`);continue;}
    }
    if(!Number.isFinite(amount)||amount<=0||amount>10000){unknown.push(frag);continue;}
    items.push({id:uuid(),foodId:f.id,name:f.name,meal:m,amount,unit:f.unit,approx:!!f.approx,origin:'文字速记'});
  }
  return {items,unknown,recognizedOverride};
}

function recentNutritionPattern(){

 const missing=key!=='kcal'&&sum.missing[key],low=range[0],high=range[1],scaleMax=Math.max(1,high*1.35),points=maxOnly?[high*.35,high*.65,high,high*1.2,scaleMax]:[low*.6,low,high,high*1.2,scaleMax],widths=points.map((point,index)=>Math.max(0,(point-(points[index-1]||0))/scaleMax*100));

 if(/unable to resolve host|network is unreachable|failed to connect|connection refused|unknown host/i.test(message))return Error('无法连接 AI 服务，请检查手机网络后重试');

async function requestAiRecognition(input,configOverride=null,keyOverride=null){if(DEMO_MODE)throw Error('示例模式不发送 AI 请求。请在自己的空白记录页配置接口。');

 const http=nativePlugin('CapacitorHttp');
 const send=async current=>{
  const options={url:buildAiEndpoint(current),method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`},data:buildAiRequestPayload(current,input),connectTimeout:AI_CONNECT_TIMEOUT_MS,readTimeout:AI_READ_TIMEOUT_MS};
  let status,responseData;
  try{
   if(IS_NATIVE_APP&&http){const response=await http.request(options);status=response.status;responseData=response.data;}
   else{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),AI_READ_TIMEOUT_MS);try{const response=await fetch(options.url,{method:'POST',headers:options.headers,body:JSON.stringify(options.data),signal:controller.signal});status=response.status;responseData=await response.text();}finally{clearTimeout(timer);}}
  }catch(error){throw aiNetworkError(error);}
  return {status,responseData};
 };
 let response;
 try{response=await send(config);}catch(error){if(!(config.provider==='ark'&&config.lowLatency&&/超时|timeout/i.test(String(error?.message))))throw error;response=await send({...config,lowLatency:false});response.fallback=true;}
 if(!(response.status>=200&&response.status<300)&&config.provider==='ark'&&config.lowLatency&&shouldFallbackFromFast(response.status,response.responseData)){response=await send({...config,lowLatency:false});response.fallback=true;}
 if(!(response.status>=200&&response.status<300))throw Error(parseAiServiceError(response.status,response.responseData));
 const output=extractAiText(response.responseData,config.protocol),draft=parseAiDraft(output,input.defaultMeal);
 if(response.fallback)draft.connectionNote='低延迟通道不可用，本次已自动切换普通通道并成功完成。';

}

function imageResultDataUrl(result){
 const thumbnail=String(result?.thumbnail||'');
 if(!thumbnail)return null;
 if(thumbnail.startsWith('data:image/'))return thumbnail;
 const rawFormat=String(result?.metadata?.format||'jpeg').toLowerCase();
 const format=['png','webp'].includes(rawFormat)?rawFormat:'jpeg';
 return `data:image/${format};base64,${thumbnail}`;
}

async function webPathToDataUrl(path){
 const response=await fetch(path);if(!response.ok)throw Error('无法读取所选照片');
 const blob=await response.blob();if(blob.size>15_000_000)throw Error('照片过大，请重新选择');
 return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(Error('无法读取照片'));reader.readAsDataURL(blob);});
}

function loadAiImage(source){
 return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(Error('无法解析所选照片'));image.src=source;});
}

async function prepareAiImageDataUrl(result,mode=aiConfig.recognitionMode){
 let source=imageResultDataUrl(result);
 if(!source&&result?.webPath)source=await webPathToDataUrl(result.webPath);
 if(!source)throw Error('照片没有可供识别的数据');
 const image=await loadAiImage(source);
 const profile=getRecognitionProfile(mode);
 for(const attempt of profile.imageAttempts){
  const scale=Math.min(1,attempt.edge/Math.max(image.naturalWidth||image.width,image.naturalHeight||image.height));
  const width=Math.max(1,Math.round((image.naturalWidth||image.width)*scale));
  const height=Math.max(1,Math.round((image.naturalHeight||image.height)*scale));
  const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
  const context=canvas.getContext('2d',{alpha:false});if(!context)throw Error('设备无法压缩照片');
  context.drawImage(image,0,0,width,height);
  const compressed=canvas.toDataURL('image/jpeg',attempt.quality);
  canvas.width=1;canvas.height=1;
  if(compressed.length<=profile.maxDataUrlLength)return compressed;
 }
 throw Error('照片压缩后仍然过大，请重新拍摄');
}

function estimatedDraftKcal(item){
 const food=matchFoodByName(item.name,item.unit);
 if(food&&item.unit===food.unit&&Number.isFinite(food.kcal))return +(food.kcal*item.amount/food.base).toFixed(1);
 return Number.isFinite(item.kcal)?item.kcal:null;
}

function openAiReview(draft,origin,retryContext=null){
 const mealOptions=value=>MEALS.map(meal=>`<option value="${meal.id}" ${meal.id===value?'selected':''}>${meal.label}</option>`).join('');
 const rows=draft.items.map((item,index)=>{
  const food=matchFoodByName(item.name,item.unit),local=food&&item.unit===food.unit,confidence=Number.isFinite(item.confidence)?item.confidence:.5,spread=Math.max(.1,Math.min(.6,.12+(1-confidence)*.5)),low=Math.max(0,item.amount*(1-spread)),high=item.amount*(1+spread);
  const source=local?{amount:item.amount,...Object.fromEntries(FIELDS.map(key=>[key,typeof food[key]==='number'?food[key]*item.amount/food.base:null]))}:item;

 }).join('');
 const canRetry=retryContext&&retryContext.mode!=='precise';

// ===== 轻衡私有同步 v4：只读自动拉取、事件去重、手动JSON备用 =====
let syncStatus=syncConfig.url?'已保存同步地址，正在等待安全连接检查':'尚未配置自动同步';
function parseSyncEvents(src){
 let arr=typeof src==='string'?JSON.parse(src.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'')):src;
 if(arr&&typeof arr==='object'&&!Array.isArray(arr)&&Array.isArray(arr.events))arr=arr.events;
 if(!Array.isArray(arr))arr=[arr];
 if(arr.length===0||arr.length>3000)throw Error('事件数量超出允许范围');
 const idTest=/^[a-zA-Z0-9_.-]{6,110}$/;
 const meals=new Set(['breakfast','lunch','dinner','snack']);
 const bounded=(v,a,b)=>v===null||(typeof v==='number'&&Number.isFinite(v)&&v>=a&&v<=b);
 const isDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(Date.parse(d))&&new Date(d+'T12:00:00Z').toISOString().slice(0,10)===d;
 const clean=[];
 for(const e of arr){
  if(!e||typeof e!=='object'||!idTest.test(e.id)||!isDate(e.date)||e.type!=='day.patch'||!e.payload||typeof e.payload!=='object'||Array.isArray(e.payload))throw Error('事件缺少合法的 id、date、type 或 payload');
  const p=e.payload;
  if(JSON.stringify(p).length>20000)throw Error('事件内容超过限制');
  if(p.entries!==undefined&&(!Array.isArray(p.entries)||p.entries.length>50))throw Error('食品列表格式有误');
  if(p.removeEntryIds!==undefined&&(!Array.isArray(p.removeEntryIds)||p.removeEntryIds.length>50||p.removeEntryIds.some(x=>typeof x!=='string'||x.length>130)))throw Error('删除食品ID格式有误');
  if(p.weight!==undefined&&!bounded(p.weight,20,400))throw Error('体重范围错误');
  if(p.activity!==undefined&&!bounded(p.activity,0,10000))throw Error('运动热量范围错误');
  if(p.calorieOverride!==undefined&&!bounded(p.calorieOverride,0,30000))throw Error('全天热量范围错误');
  if(p.poop!==undefined&&!['before','after','unspecified'].includes(p.poop))throw Error('排便状态错误');
  if(p.noteAppend!==undefined&&(typeof p.noteAppend!=='string'||p.noteAppend.length>300))throw Error('备注超长');
  if(p.mealOverrides!==undefined){if(!p.mealOverrides||typeof p.mealOverrides!=='object'||Array.isArray(p.mealOverrides))throw Error('餐食校准有误');for(const [m,k] of Object.entries(p.mealOverrides))if(!meals.has(m)||!bounded(k,0,30000))throw Error('餐食热量校准有误');}
  for(const f of p.entries||[]){
   if(!f||typeof f!=='object'||typeof f.id!=='string'||!f.id||f.id.length>130||typeof f.name!=='string'||!f.name.trim()||f.name.length>180||!meals.has(f.meal)||typeof f.amount!=='number'||!Number.isFinite(f.amount)||f.amount<=0||f.amount>10000||typeof f.unit!=='string'||f.unit.length>20)throw Error('食品条目格式不正确');
   if(f.foodId!==undefined&&(typeof f.foodId!=='string'||f.foodId.length>80))throw Error('foodId 格式错误');
   if(f.custom)for(const key of FIELDS)if(f[key]!==undefined&&!bounded(f[key],0,100000))throw Error('食品营养素格式错误');
  }
  clean.push({id:e.id,date:e.date,type:e.type,payload:p});
 }
 return clean;
}
function applySyncEvents(raw){
 const events=parseSyncEvents(raw),seen=new Set(data.syncEventIds||[]),applied=[];
 for(const e of events){
  if(seen.has(e.id))continue;
  const p=e.payload,day=data.days[e.date]??=emptyDay();day.mealOverrides||={};day.entries||=[];
  if(p.removeEntryIds){const del=new Set(p.removeEntryIds);day.entries=day.entries.filter(f=>!del.has(f.id));}
  for(const f of p.entries||[]){
   const match=(f.foodId&&findFood(f.foodId))||FOOD_DB.find(x=>x.name===f.name||x.aliases?.includes(f.name));
   const custom=!!f.custom||!match;
   const ent={id:f.id,name:f.name,meal:f.meal,foodId:custom?'custom':match.id,custom,amount:f.amount,unit:f.unit,approx:f.approx!==false,origin:'聊天同步'};
   if(custom)for(const k of FIELDS)ent[k]=typeof f[k]==='number'?f[k]:null;
   const index=day.entries.findIndex(x=>x.id===ent.id);
   if(index>=0)day.entries[index]=ent;else day.entries.push(ent);
  }
  for(const key of ['weight','activity','calorieOverride','poop'])if(Object.prototype.hasOwnProperty.call(p,key)){
    day[key]=p[key];
    if(key==='weight'){if(p.weight===null)delete data.weightHistory[e.date];else data.weightHistory[e.date]=p.weight;}
  }
  for(const [meal,val] of Object.entries(p.mealOverrides||{})){if(val===null)delete day.mealOverrides[meal];else day.mealOverrides[meal]=val;}
  if(typeof p.noteAppend==='string'&&p.noteAppend.trim()){day.note=(day.note?day.note+'；':'')+p.noteAppend.trim();day.note=day.note.slice(0,400);}
  seen.add(e.id);applied.push(e);
 }
 if(applied.length){data.syncEventIds=[...seen].slice(-5000);save();render();}
 return {applied:applied.length,duplicate:events.length-applied.length,dates:[...new Set(applied.map(x=>x.date))]};
}

function readPhoneSession(key){if(DEMO_MODE)return '';try{return sessionStorage.getItem(key)||'';}catch{return '';}}

function phoneOutbox(){if(DEMO_MODE)return [];try{const a=JSON.parse(localStorage.getItem(PHONE_OUTBOX)||'[]');return Array.isArray(a)?a.slice(0,1000):[];}catch{return [];}}
function savePhoneOutbox(a){localStorage.setItem(PHONE_OUTBOX,JSON.stringify(a));}
function phoneBootstrapped(){try{return localStorage.getItem(PHONE_BOOTSTRAP)===syncConfig.url;}catch{return false;}}

function enqueuePhoneDifference(date,oldDay,newDay){
 const patch=diffDay(oldDay,newDay,calcNutrition),chunks=splitPatch(patch);
 if(!chunks.length)return;
 const out=phoneOutbox();
 if(out.length+chunks.length>500)throw Error('待上传记录超过上限，请先完成同步并导出备份');
 for(const chunk of chunks)out.push(makeEvent(date,chunk));
 savePhoneOutbox(out);syncStatus='本机已保存，待上传 '+out.length+' 条变更';

}
async function flushPhoneOutbox(manual=false){if(DEMO_MODE)return;
 if(IS_NATIVE_APP||phonePushBusy||syncBusy||!syncWriteTokenAvailable||!syncConfig.url||!phoneBootstrapped())return;
 if(!hasPrivacyConsent())return;
 phonePushBusy=true;
 try{
  while(phoneOutbox().length){
   const current=phoneOutbox()[0],token=readPhoneSession(PHONE_WRITE_SESSION);
   if(!token)throw Error('手机写入凭据已失效');
   const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);let response;
   try{response=await fetch(syncConfig.url+'/v1/events',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(current),mode:'cors',cache:'no-store',signal:controller.signal});}finally{clearTimeout(timer);}
   if(!response.ok)throw Error(response.status===401?'写入密钥错误（401）':response.status===409?'云端事件ID冲突（409）':'上传 HTTP '+response.status);
   const ack=await response.json();if(!ack?.ok||ack.id!==current.id)throw Error('云端回执格式不正确');
   data.syncEventIds=[...new Set([...(data.syncEventIds||[]),current.id])].slice(-5000);save();
   // 再次读取实时队列：避免上传过程中有新增记录时，覆盖/丢失新事件。
   const remaining=phoneOutbox();if(remaining[0]?.id===current.id)remaining.shift();
   else {const at=remaining.findIndex(x=>x.id===current.id);if(at>=0)remaining.splice(at,1);}
   savePhoneOutbox(remaining);
  }
  syncStatus='双向同步：本机变更已上传';if(manual)showToast(syncStatus);
 }catch(error){syncStatus='本机已保存，云端待重试：'+safeMessage(error,'上传失败');if(manual)showToast(syncStatus);}
 finally{phonePushBusy=false;if(tab==='profile')render();}
}
async function refreshSyncReadTokenStatus(shouldRender=false){if(DEMO_MODE){syncReadTokenAvailable=false;syncWriteTokenAvailable=false;return false;}
 try{const secure=nativePlugin('SecureSettings');syncReadTokenAvailable=secure?Boolean((await secure.hasSyncReadToken()).value):Boolean(readPhoneSession(PHONE_READ_SESSION));}
 catch{syncReadTokenAvailable=false;}
 syncWriteTokenAvailable=!IS_NATIVE_APP&&Boolean(readPhoneSession(PHONE_WRITE_SESSION));
 if(shouldRender&&tab==='profile')render();
 return syncReadTokenAvailable;
}
async function readSyncReadToken(){
 const secure=nativePlugin('SecureSettings');
 if(!secure){const value=readPhoneSession(PHONE_READ_SESSION);if(!value)throw Error('请重新输入网页版只读密钥');return value;}
 const result=await secure.getSyncReadToken();
 if(!result?.value)throw Error('尚未保存手机只读密钥');
 return result.value;
}
async function openSyncConfig(){if(DEMO_MODE){showToast('示例模式不连接云端。使用自己的空白记录页后可配置私人同步。');return;}

 `<label class="field-label">Cloudflare Worker HTTPS 地址</label><input class="input" id="syncUrl" type="url" spellcheck="false" autocomplete="off" value="${esc(syncConfig.url)}" placeholder="https://your-sync.example.com"/><label class="field-label top-gap">${web?'手机只读密钥':'手机只读密钥（Keystore）'}（QH_READ_TOKEN）</label><input class="input" id="syncReadToken" type="password" autocomplete="off" spellcheck="false" maxlength="4096" placeholder="${hasToken?'当前已填写，留空不更换':'填写只读密钥'}"/>
 ${web?`<label class="field-label">手机写入密钥（QH_WRITE_TOKEN）</label><input class="input" id="syncWriteToken" type="password" spellcheck="false" autocomplete="off" maxlength="4096" placeholder="${syncWriteTokenAvailable?'当前已填写，留空不更换':'填写写入密钥以启用双向同步'}"/><div class="info-box top-gap">两种凭据仅存于当前浏览器标签页会话，不写入公开网页代码、本地永久存储或 JSON 备份。关闭标签或清除网站数据后需重填。网页安全性弱于 Android Keystore，请只在你控制的设备和 HTTPS 页面操作。</div>`:`<div class="info-box top-gap">安卓原生密钥继续使用系统 Keystore。本升级包主要提供 iPhone Safari 网页双向同步。</div>`}
 <div class="warning-box info-box top-gap">不要把任何密钥发到 ChatGPT 对话里。请先在旧版导出数据备份。历史记录不会自动整批上传。</div>
 <div class="sheet-buttons"><button class="secondary-btn" data-close>取消</button><button class="primary-btn" id="saveSyncConfig">保存并测试</button></div>${syncConfig.url||hasToken?'<button class="danger-btn" id="clearSyncConfig" style="width:100%;margin-top:10px">停用自动同步</button>':''}`);
 const secure=nativePlugin('SecureSettings'),statusButton=sheet.querySelector('#saveSyncConfig');
 statusButton.onclick=async()=>{

   syncConfig={url};localStorage.setItem(SYNC_URL_STORE,url);syncReadTokenAvailable=true;

  }catch(error){statusButton.disabled=false;showToast(safeMessage(error,'无法保存同步设置'));}
 };
 sheet.querySelector('#clearSyncConfig')?.addEventListener('click',async()=>{

   localStorage.removeItem(PHONE_WRITE_ENABLED);localStorage.removeItem(SYNC_URL_STORE);syncConfig={url:''};syncReadTokenAvailable=false;syncWriteTokenAvailable=false;syncStatus='自动同步已停用，本机记录和待上传队列保留';closeSheet();render();showToast('自动同步已停用');}

 });

async function pullSync(manual=false){if(DEMO_MODE)return;
 if(!hasPrivacyConsent()){if(manual)showPrivacyGate();return;}

 const hasToken=await refreshSyncReadTokenStatus();

 syncBusy=true;
 try{
  const token=await readSyncReadToken();let cursor='',events=[],loops=0;
  while(loops++<30){
   const url=syncConfig.url+'/v1/events'+(cursor?'?cursor='+encodeURIComponent(cursor):'');
   const controller=new AbortController();activeSyncController=controller;const timer=setTimeout(()=>controller.abort(),20000);let response;
   try{response=await fetch(url,{method:'GET',headers:{'Authorization':'Bearer '+token},cache:'no-store',mode:'cors',signal:controller.signal});}finally{clearTimeout(timer);if(activeSyncController===controller)activeSyncController=null;}
   if(!response.ok)throw Error(response.status===401?'手机只读密钥错误（401）':`同步服务返回 HTTP ${response.status}`);
   const payload=await response.json();if(!payload?.ok||!Array.isArray(payload.events))throw Error('同步服务响应格式无效');
   events.push(...payload.events);if(events.length>3000)throw Error('云端事件过多，请先联系开发者处理归档');

  syncStatus=`上次检查 ${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} · 新增 ${result.applied} 条 · 待上传 ${phoneOutbox().length} 条`;
  if(manual||result.applied)showToast(result.applied?`已自动同步 ${result.applied} 条新记录`:'连接成功，没有新记录');
  if(tab==='profile')render();
 }catch(error){syncStatus='同步失败：'+safeMessage(error,'无法连接同步服务');if(manual)showToast(syncStatus);if(tab==='profile')render();}
 finally{activeSyncController=null;syncBusy=false;}
}
