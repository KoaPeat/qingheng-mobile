function calcNutrition(entry){
  if(entry.custom){const out={};for(const k of FIELDS)out[k]=Number.isFinite(entry[k])?entry[k]:null;return out;}

function validateState(src){

function quickParse(text, meal='snack'){
  const items=[];const unknown=[];let recognizedOverride=null;
  const overrideMatch=text.match(/(?:全天|总(?:热量|摄入)|今日)(?:的?(?:热量|摄入))?\s*(?:按|算|定为|记为|改成|改为)?\s*(\d{2,5})\s*(?:千卡|大卡|kcal|卡)/i);
  if(overrideMatch)recognizedOverride=Number(overrideMatch[1]);
  let txt=text.replace(/\s+/g,'').replace(/[，、＋+和跟与]/g,';').replace(/\n/g,';');
  // Expand special non-canonical phrases and chinese numerals.
  const zh={'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
  txt=txt.replace(/([一二两三四五六七八九十])(?=个|颗|袋|包|根|罐|瓶)/g,(_,v)=>String(zh[v]));
  const fragments=txt.split(/[;；。:：]/).map(s=>s.trim()).filter(Boolean);
  for(const frag of fragments){
    if(/全天|总热量|总摄入/.test(frag)&&/\d+/.test(frag))continue;
    let m=meal;
    if(/午餐|中午/.test(frag))m='lunch';else if(/晚餐|晚上|睡前/.test(frag))m='dinner';else if(/早餐|早上/.test(frag))m='breakfast';else if(/加餐|下午/.test(frag))m='snack';
    const stripped=frag.replace(/^(?:早餐|午餐|晚餐|加餐|中午|下午|晚上|睡前|早上)(?:是|吃|加|了|有|为)?/,'');
    const indexed=FOOD_DB.flatMap(f=>[f.name,...f.aliases].filter(Boolean).map(alias=>({f,alias}))).sort((a,b)=>b.alias.length-a.alias.length);
    const match=indexed.find(x=>stripped.includes(x.alias));
    if(!stripped)continue;
    if(!match){unknown.push(frag);continue;}
    const {f,alias}=match;
    const before=stripped.slice(0,stripped.indexOf(alias)),after=stripped.slice(stripped.indexOf(alias)+alias.length);
    const rx=/(\d+(?:\.\d+)?)\s*(克|g|毫升|ml|个|颗|袋|包|瓶|根|罐)/i;
    const grams=Array.from(stripped.matchAll(/(\d+(?:\.\d+)?)\s*(g|克|ml|毫升)/gi));
    // When count and weight coexist ("三个大番茄750g"), prefer gram weight.
    let picked=grams.length?grams[grams.length-1]:after.match(rx)||before.match(rx)||stripped.match(rx);
    if(!picked && (f.unit==='g'||f.unit==='ml')){unknown.push(`${frag}（请写明重量或体积）`);continue;}
    let amount=picked?Number(picked[1]):1;
    const rawUnit=picked?picked[2]:(f.unit);
    const unit=/克|g/i.test(rawUnit)?'g':/毫升|ml/i.test(rawUnit)?'ml':/个|颗/.test(rawUnit)?'个':/袋|包/.test(rawUnit)?'袋':/瓶/.test(rawUnit)?'瓶':/根/.test(rawUnit)?'根':/罐/.test(rawUnit)?'罐':f.unit;
    if(unit!==f.unit){
      if(f.unit==='g'&&unit!=='g'){
        // Only convert to grams for foods where one-piece weight was recorded.
        const pieceGram={egg_whitewater:30,kiwi:85,meat_egg:60,egg:55,beef_patty:50};
        if(!pieceGram[f.id]){unknown.push(`${frag}（请用克数）`);continue;}

      }else if(f.unit==='ml'&&unit==='瓶'&&f.id==='tomato_juice')amount*=220;

      else if(f.unit!=='g'&&f.unit!=='ml'&&unit!==f.unit){unknown.push(`${frag}（单位不匹配）`);continue;}
    }
    if(!Number.isFinite(amount)||amount<=0||amount>10000){unknown.push(frag);continue;}
    items.push({id:uuid(),foodId:f.id,name:f.name,meal:m,amount,unit:f.unit,approx:!!f.approx,origin:'文字速记'});
  }
  return {items,unknown,recognizedOverride};
}

function mealCard(day,m){const entries=day.entries.filter(e=>e.meal===m.id),tot=calorieTotals(day).byMeal[m.id];return `<div class="meal-card"><div class="meal-head"><div class="meal-name"><span class="meal-symbol">${m.icon}</span>${m.label} <span class="muted" style="font-size:10px;font-weight:400">${entries.length} 项</span></div><div class="meal-total">${fmt(tot.display)} kcal</div></div>${entries.length?entries.map(e=>{const kcal=calcNutrition(e).kcal;return `<div class="meal-item"><div style="flex:1"><div class="meal-item-title">${esc(e.name)} ${e.approx?'<span class="badge warn">估算</span>':''}</div><div class="meal-item-sub">${fmt(e.amount)} ${esc(e.unit||'')} · ${esc(e.origin||'食品库')}</div></div><div class="item-kcal">${kcal===null?'—':fmt(kcal)}</div><button class="ghost-delete" data-action="delete" data-id="${esc(e.id)}" aria-label="删除食物">✕</button></div>`}).join(''):`<div class="empty-text">还没有记录 ${m.label}</div>`}<div class="row" style="margin-top:12px"><button class="link" data-action="add-food" data-meal="${m.id}">＋ 添加${m.label}</button><button class="link" data-action="meal-override" data-meal="${m.id}">${tot.override===null?'校准本餐热量':`已校准 ${fmt(tot.override)} · 修改`}</button></div></div>`}

function makeChart(){const dates=daysBack(activeDate,14);const points=dates.map(d=>({d,w:Number.isFinite(data.weightHistory[d])?data.weightHistory[d]:getDay(data,d).weight})).filter(x=>Number.isFinite(x.w));
 if(!points.length)return `<div class="empty-text">尚无体重记录。点击总览中的晨重卡片添加。</div>`;
 const vals=points.map(p=>p.w); const mn=Math.min(...vals)-.4,mx=Math.max(...vals)+.4;const x=(d)=>25+((dates.indexOf(d))/(dates.length-1))*300,y=v=>140-(v-mn)/(mx-mn)*118;
 const poly=points.map(p=>`${x(p.d).toFixed(1)},${y(p.w).toFixed(1)}`).join(' ');
 return `<svg class="weight-chart" viewBox="0 0 340 170" role="img" aria-label="最近14日晨重曲线"><line class="chart-grid" x1="22" y1="25" x2="330" y2="25"/><line class="chart-grid" x1="22" y1="85" x2="330" y2="85"/><line class="chart-grid" x1="22" y1="145" x2="330" y2="145"/><text class="chart-label" x="0" y="25">${mx.toFixed(1)}</text><text class="chart-label" x="0" y="146">${mn.toFixed(1)}</text><polyline class="chart-line" points="${poly}"/>${points.map(p=>`<circle class="chart-circle" cx="${x(p.d)}" cy="${y(p.w)}" r="4"/>`).join('')}<text class="chart-label" x="25" y="162">${formattedDate(dates[0])}</text><text class="chart-label" x="286" y="162">${formattedDate(dates.at(-1))}</text></svg>`;
}
function renderTrends(){const dates=daysBack(activeDate,7);const weights=dates.map(d=>data.weightHistory[d]??getDay(data,d).weight).filter(Number.isFinite);const avg=weights.length?weights.reduce((a,b)=>a+b,0)/weights.length:null;const totalCals=dates.reduce((a,d)=>a+calorieTotals(getDay(data,d)).display,0);const daysWithFood=dates.filter(d=>getDay(data,d).entries.length||calorieTotals(getDay(data,d)).override!==null).length;

function openWeight(){const d=getDay(data,activeDate);openSheet(header('记录晨起体重','与基础计算体重分开。建议记录起床、排尿后且进食前的数值。')+`<label class="field-label">真实晨重 (kg)</label><input class="input" type="number" min="20" max="300" step="0.05" value="${d.weight??''}" id="weightValue" autofocus placeholder="例如 73.50"/><label class="field-label">排便情况</label><select class="input" id="poopValue"><option value="unspecified" ${d.poop==='unspecified'?'selected':''}>未说明</option><option value="before" ${d.poop==='before'?'selected':''}>排便前</option><option value="after" ${d.poop==='after'?'selected':''}>排便后</option></select><div class="sheet-buttons"><button class="secondary-btn" data-close>取消</button><button class="primary-btn" id="saveWeight">保存晨重</button></div>`);sheet.querySelector('#saveWeight').onclick=()=>{const w=num(sheet.querySelector('#weightValue').value);if(!(w>20&&w<300)){showToast('请输入有效晨重');return;}mutate(()=>{const day=ensureDay();day.weight=w;day.poop=sheet.querySelector('#poopValue').value;data.weightHistory[activeDate]=w;});closeSheet();showToast('已更新晨重（不改变固定的代谢计算基准）');};}
function openActivity(){const d=getDay(data,activeDate);openSheet(header('记录手环活动消耗','只填手表显示的“活动热量”，不要输入包含静息消耗的“总热量”。')+`<label class="field-label">活动消耗 (kcal)</label><input class="input" type="number" min="0" max="10000" id="activityValue" value="${d.activity??''}" autofocus/><div class="sheet-buttons"><button class="secondary-btn" data-close>取消</button><button class="primary-btn" id="saveActivity">保存运动消耗</button></div>`);sheet.querySelector('#saveActivity').onclick=()=>{const v=num(sheet.querySelector('#activityValue').value);if(v===null||v<0||v>10000){showToast('请输入有效活动热量');return;}mutate(()=>ensureDay().activity=v);closeSheet();showToast('已更新活动消耗');};}
function openOverride(meal=null){const d=getDay(data,activeDate);const existing=meal?(d.mealOverrides?.[meal]??''):(d.calorieOverride??'');const isMeal=!!meal;
openSheet(header(isMeal?'本餐热量校准':'全天热量校准',isMeal?'如果整餐估算比食物分项更可靠，可直接确认本餐总热量。':'例如你习惯说“全天直接按2000卡算”，可在这里确认最终总计。')+`<label class="field-label">${isMeal?'整餐':'全天'}确认热量 (kcal)</label><input type="number" class="input" id="overrideValue" value="${existing}" min="0" step="any" placeholder="留空表示取消校准" autofocus/><div class="info-box top-gap">食品清单仍会保留；营养成分继续由每项食物计算，校准热量不会凭空生成蛋白质或维生素数值。</div><div class="sheet-buttons"><button class="secondary-btn" data-close>取消</button><button class="primary-btn" id="saveOverride">保存校准</button></div>`);
 sheet.querySelector('#saveOverride').onclick=()=>{const raw=sheet.querySelector('#overrideValue').value,v=num(raw);if(v!==null&&(v<0||v>30000)){showToast('请输入有效热量');return;}mutate(()=>{const d=ensureDay();if(isMeal){if(v===null)delete d.mealOverrides[meal];else d.mealOverrides[meal]=v;}else d.calorieOverride=v;});closeSheet();showToast(v===null?'已取消校准':'已更新确认热量');};
}
function openSettings(){const s=data.settings;openSheet(header('调整身体基准','实际晨重与固定的代谢计算体重是两套独立数据。')+`<div class="input-grid">${[['baselineKg','基准体重 kg'],['heightCm','身高 cm'],['age','年龄'],['goalMinKg','目标下限 kg'],['goalMaxKg','目标上限 kg']].map(([k,title])=>`<div><label class="field-label">${title}</label><input class="input setting-val" data-key="${k}" type="number" step="any" min="1" value="${s[k]}"/></div>`).join('')}</div><div class="sheet-buttons"><button class="secondary-btn" data-close>取消</button><button class="primary-btn" id="saveSettings">保存基准</button></div>`);sheet.querySelector('#saveSettings').onclick=()=>{const updates={};for(const inp of sheet.querySelectorAll('.setting-val')){const n=num(inp.value);if(n===null||n<=0||n>400){showToast('检查基准数值');return;}updates[inp.dataset.key]=n;}if(updates.goalMinKg>updates.goalMaxKg){showToast('目标体重区间顺序有误');return;}mutate(()=>Object.assign(data.settings,updates));closeSheet();showToast('已更新身体基准');};}
function exportBackup(){const text=JSON.stringify(data,null,2),blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`轻衡-私人备份-${localDate()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);showToast('已生成 JSON 备份，请妥善保存');}
function openImport(){openSheet(header('导入历史备份','可选择附带的私人初始记录文件，或曾经由本应用导出的 JSON。导入会覆盖当前本机记录。')+`<div class="info-box">请只导入自己信任的 JSON 文件。导入前建议先导出当前记录作为备份。</div><label class="field-label">选择 .json 文件</label><input class="input" id="importFile" type="file" accept=".json,application/json"/><div id="importDesc" class="card-caption"></div><div class="sheet-buttons"><button class="secondary-btn" data-close>取消</button><button class="primary-btn" id="submitImport">确认导入</button></div>`);sheet.querySelector('#submitImport').onclick=async()=>{const file=sheet.querySelector('#importFile').files?.[0];if(!file){showToast('先选择文件');return;}if(file.size>2_000_000){showToast('备份文件太大');return;}let next;try{next=validateState(JSON.parse(await file.text()));}catch(e){showToast(`文件有误：${e.message}`);return;}if(!confirm(`确认覆盖本机所有记录？\n该文件包含 ${Object.keys(next.days).length} 天的记录。`))return;data=next;save();closeSheet();activeDate=localDate();render();showToast('历史记录导入成功');};}
function reset(){if(confirm('这将清空本机所有饮食、晨重和设置，且无法撤销。确定继续？')){if(confirm('最后确认：你已经导出必要的备份了吗？')){data={...initState(),days:{},weightHistory:{}};save();tab='home';activeDate=localDate();render();showToast('本机数据已清空');}}}
const actions={
 'prev-date':()=>changeDate(-1),'next-date':()=>changeDate(1),'go-food':()=>{tab='food';render()},'add-food':a=>openFoodPicker(a.dataset.meal||'lunch'),
 'quick':()=>openQuick(),'custom':()=>openCustom(),'weight':()=>openWeight(),'activity':()=>openActivity(),
 'override':()=>openOverride(),'meal-override':a=>openOverride(a.dataset.meal),
 'delete':a=>{const entry=getDay(data,activeDate).entries.find(e=>e.id===a.dataset.id);if(entry&&confirm(`删除 ${entry.name}？`))mutate(()=>ensureDay().entries=ensureDay().entries.filter(e=>e.id!==a.dataset.id));},
 'settings':()=>openSettings(),'export':()=>exportBackup(),'import':()=>openImport(),'reset':()=>reset()
};
main.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a&&actions[a.dataset.action])actions[a.dataset.action](a);});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;main.scrollTop=0;window.scrollTo(0,0);render()}));
document.querySelector('#addButton').onclick=()=>openFoodPicker('lunch');
document.querySelector('#menuButton').onclick=()=>{tab='profile';render();window.scrollTo(0,0)};
overlay.addEventListener('click',e=>{if(e.target===overlay||e.target.closest('[data-close]'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.classList.contains('hidden'))closeSheet()});
window.addEventListener('storage',e=>{if(e.key===STORE&&e.newValue){try{data=validateState(JSON.parse(e.newValue));render();}catch{}}});
let seenDate=localDate();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&seenDate!==localDate()){const prev=seenDate;seenDate=localDate();if(activeDate===prev){activeDate=seenDate;render();}showToast('已切换到新的一天');}});

render();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', {scope:'./'}).catch(err => console.warn('Offline setup failed:',err)));
}
</script>
</body></html>
