function normalizeFood(raw,index){

  if(!['g','ml','个','袋','包','瓶','份','根','罐','片'].includes(raw.unit))throw Error(`食品「${raw.name}」单位无效`);
  const base=Number(raw.base); if(!Number.isFinite(base)||base<=0||base>10000)throw Error(`食品「${raw.name}」基准数量无效`);
  const id=typeof raw.id==='string'&&/^[A-Za-z0-9_-]{1,90}$/.test(raw.id)?raw.id:'import_'+index+'_'+Date.now();
  const out={id,name:raw.name.trim(),aliases:Array.isArray(raw.aliases)?raw.aliases.filter(x=>typeof x==='string'&&x.length<=30).slice(0,12):[],category:typeof raw.category==='string'?raw.category.slice(0,30):'自定义',base,unit:raw.unit,approx:raw.approx!==false};
  for(const k of ['kcal','protein','carbs','fat','fiber','sodium','potassium','calcium','vitC']){const v=raw[k];out[k]=typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=100000?v:null;}
  if(out.kcal===null)throw Error(`食品「${out.name}」缺少有效热量`);
  out.source=typeof raw.source==='string'?raw.source.slice(0,120):'用户导入';
  return out;
}
function loadUserFoods(){
 try{
  const p=JSON.parse(localStorage.getItem(FOOD_LIBRARY_STORE)||'[]');
  if(!Array.isArray(p)||p.length>5000)return;
  const seen=new Set(FOOD_DB.map(f=>f.id));
  for(let i=0;i<p.length;i++){
   try{const f=normalizeFood(p[i],i);if(seen.has(f.id))continue;seen.add(f.id);FOOD_DB.push(f);}catch(e){console.warn('Skipped stored food',e)}
  }
 }catch(e){console.warn('Unable to read user food library',e)}
}

function localDate(d=new Date()) { const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`; }
function uuid(){return (globalThis.crypto?.randomUUID?.() ?? `id-${Date.now()}-${Math.random().toString(36).slice(2)}`);}
function findFood(id){return FOOD_DB.find(x=>x.id===id);}
function calcNutrition(entry){
  if(entry.custom){const out={};for(const k of FIELDS)out[k]=Number.isFinite(entry[k])?entry[k]:null;return out;}
  const food=findFood(entry.foodId);if(!food)return Object.fromEntries(FIELDS.map(k=>[k,null]));
  const factor=Number(entry.amount)/food.base;
  if(!Number.isFinite(factor)||factor<=0)return Object.fromEntries(FIELDS.map(k=>[k,null]));
  const out={};for(const k of FIELDS)out[k]=(typeof food[k]==='number') ? +((food[k]*factor).toFixed(2)) : null;
  return out;
}
function emptyDay(){return {entries:[],activity:null,weight:null,poop:'unspecified',note:'',calorieOverride:null,mealOverrides:{}};}
function initState(){
  // Never embed private daily weight or food logs into public-facing app source.
  // The user's private history is in the separately importable *.private.json backup.
  return {version:1,settings:{...DEFAULT_SETTINGS},days:{},weightHistory:{},createdAt:new Date().toISOString()};
}
function validateState(src){
  if(!src||typeof src!=='object'||!src.days||typeof src.days!=='object')throw Error('文件中没有有效的日期记录');
  const clean={version:1,createdAt:typeof src.createdAt==='string'?src.createdAt:new Date().toISOString(),settings:{...DEFAULT_SETTINGS},days:{},weightHistory:{}};
  for(const k of Object.keys(DEFAULT_SETTINGS)){const v=src.settings?.[k];if(typeof v==='number'&&Number.isFinite(v)&&v>0)clean.settings[k]=v;}
  for(const [date, raw] of Object.entries(src.days)){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!raw||typeof raw!=='object')continue;
    const day=emptyDay();day.weight=Number.isFinite(raw.weight)?raw.weight:null;
    day.activity=Number.isFinite(raw.activity)?Math.max(0,raw.activity):null;
    day.calorieOverride=Number.isFinite(raw.calorieOverride)?Math.max(0,raw.calorieOverride):null;
    day.poop=['before','after','unspecified'].includes(raw.poop)?raw.poop:'unspecified';
    day.note=typeof raw.note==='string'?raw.note.slice(0,400):'';
    if(raw.mealOverrides&&typeof raw.mealOverrides==='object')for(const key of MEALS.map(m=>m.id)) if(Number.isFinite(raw.mealOverrides[key])&&raw.mealOverrides[key]>=0)day.mealOverrides[key]=raw.mealOverrides[key];
    if(Array.isArray(raw.entries)) day.entries=raw.entries.slice(0,300).filter(e=>e&&typeof e==='object'&&MEALS.some(m=>m.id===e.meal)&&typeof e.name==='string'&&e.name.length<200 && (e.custom||findFood(e.foodId))).map(e=>{
      const out={id:typeof e.id==='string'?e.id:uuid(),name:e.name,meal:e.meal,foodId:e.foodId,amount:Number.isFinite(e.amount)?e.amount:1,unit:typeof e.unit==='string'?e.unit:'g',custom:!!e.custom,origin:typeof e.origin==='string'?e.origin:'导入',approx:!!e.approx};
      if(out.custom)for(const f of FIELDS)out[f]=Number.isFinite(e[f])?Math.max(0,e[f]):null;
      return out;
    });
    clean.days[date]=day;
  }
  if(src.weightHistory&&typeof src.weightHistory==='object')for(const [d,w] of Object.entries(src.weightHistory))if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&typeof w==='number'&&w>20&&w<400)clean.weightHistory[d]=w;
  return clean;
}
function getDay(state,date){return state.days[date]??emptyDay();}
function sums(entries){
  const result={};for(const k of FIELDS)result[k]=0;
  const missing={};for(const k of FIELDS)missing[k]=0;
  for(const e of entries){const v=calcNutrition(e);for(const k of FIELDS){if(v[k]===null)missing[k]++;else result[k]+=v[k];}}
  for(const k of FIELDS) result[k]=+(result[k].toFixed(1));
  return {result,missing,entryCount:entries.length};
}
function calorieTotals(day){
  const byMeal={};for(const m of MEALS){const entries=day.entries.filter(e=>e.meal===m.id); const raw=sums(entries).result.kcal;const override=day.mealOverrides?.[m.id];byMeal[m.id]={raw,display:Number.isFinite(override)?override:raw,override:Number.isFinite(override)?override:null};}
  const estimated=Object.values(byMeal).reduce((a,m)=>a+m.display,0);
  const corrected=Number.isFinite(day.calorieOverride)?day.calorieOverride:estimated;
  return {byMeal,estimated:+estimated.toFixed(1),display:+corrected.toFixed(1),override:Number.isFinite(day.calorieOverride)?day.calorieOverride:null};
}
function bmr(settings){const weight=settings.baselineKg,height=settings.heightCm,age=settings.age;return Math.round(10*weight+6.25*height-5*age+(settings.sex==='female'?-161:5));}
function expend(day,settings){const activityKnown=Number.isFinite(day.activity),activity=activityKnown?day.activity:null,tef=Math.round(calorieTotals(day).display*0.08);return {bmr:bmr(settings),activity,activityKnown,tef,total:bmr(settings)+(activity??0)+tef};}
function nutritionAdvice(day,settings=DEFAULT_SETTINGS){
  const {result,missing,entryCount}=sums(day.entries);const advice=[];
  if(!entryCount)return [{key:'start',severity:'normal',title:'先记下今天的饮食',message:'录入食品和分量后，软件会按已知营养成分自动更新建议。',action:'记录第一餐'}];
  const scarce=(key)=>missing[key]/entryCount > .33;
  if(scarce('protein'))advice.push({key:'quality',severity:'normal',title:'部分食品缺少营养标签',message:'已统计的营养数值只是下限，建议补充包装营养信息，以免误判缺乏。',action:'完善营养数据'});
  const energyGap=expend(day,settings).total-calorieTotals(day).display;
  if((day.activity||0)>150&&energyGap>600)advice.push({key:'energy',severity:'normal',title:'运动日要留意能量恢复',message:`按已录入项目估算，当前缺口约 ${fmt(energyGap)} kcal；如果今天已基本吃完，建议补充主食、优质蛋白和适量脂肪，不必刻意追求超大缺口。`,action:'参考：土豆、燕麦、鸡胸肉或豆制品'});
  if(result.protein<90)advice.push({key:'protein',severity:'normal',title:`蛋白质还差约 ${Math.ceil(90-result.protein)} g`,message:scarce('protein')?'存在未记录的蛋白质，请先核对标签；若确实不足，可选鸡胸肉、豆浆、鸡蛋等。':'优先选择原味鸡胸肉、豆制品或鸡蛋，保持充足的恢复营养。',action:'参考：100g熟鸡胸肉约31g蛋白质'});
  if(result.fiber<30)advice.push({key:'fiber',severity:'normal',title:'补一些膳食纤维',message:`已知约 ${fmt(result.fiber)} g / 30 g。可考虑深色蔬菜250 g＋一份水果或豆类。${scarce('fiber')?'（部分餐食缺少纤维数据）':''}`,action:'西兰花、菠菜、猕猴桃'});
  if(result.calcium<1000)advice.push({key:'calcium',severity:'normal',title:'关注钙摄入',message:`已知约 ${fmt(result.calcium)} mg / 1000 mg。牛奶250 ml约可补钙300 mg，或选择有钙标签的乳品/强化豆制品。${scarce('calcium')?'部分食品钙含量尚未录入。':''}`,action:'可选纯牛奶/低糖酸奶'});
  if(result.vitC<90)advice.push({key:'vitC',severity:'normal',title:'可补充维生素 C',message:`已知约 ${fmt(result.vitC)} mg / 90 mg；一份猕猴桃或彩椒、绿叶菜可以帮助达标。${scarce('vitC')?'仍有食品维C数据未知。':''}`,action:'参考：猕猴桃85g约78mg'});
  if(result.potassium<3400)advice.push({key:'potassium',severity:'normal',title:'优先从食物获得钾',message:`已知约 ${fmt(result.potassium)} mg / 3400 mg。可从土豆、蔬菜、豆类和水果补充；不要根据此估算自行加量服用钾片。${scarce('potassium')?'部分记录不含钾数据。':''}`,action:'土豆、菠菜、豆制品'});
  if(result.sodium>=2000)advice.unshift({key:'sodium',severity:'warn',title:'已知钠摄入达到较高水平',message:`已有标签可计算出 ${fmt(result.sodium)} mg 钠，达到或超过2000 mg；今天其余餐食尽量清淡，尤其注意卤味和加工肉类。`,action:'少选卤味、汤底与高盐酱料'});
  else if(scarce('sodium'))advice.push({key:'sodium-data',severity:'normal',title:'留意卤味中的隐形钠',message:'部分卤制食品没有精确钠标签，当前钠统计可能明显低估。',action:'以实际营养标签为准'});
  return advice.slice(0,6);
}
function fmt(num){return Number.isFinite(num)?Number(num.toFixed(1)).toLocaleString('zh-CN'):'—';}
function daysBack(date,count){const ret=[];const d=new Date(`${date}T12:00:00`);for(let i=count-1;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);ret.push(localDate(x));}return ret;}
function quickParse(text, meal='snack'){
  const items=[];const unknown=[];let recognizedOverride=null;
  const overrideMatch=text.match(/(?:全天|总(?:热量|摄入)|今日)(?:的?(?:热量|摄入))?\s*(?:按|算|定为|记为|改成|改为)?\s*(\d{2,5})\s*(?:千卡|大卡|kcal|卡)/i);
  if(overrideMatch)recognizedOverride=Number(overrideMatch[1]);
  let txt=text.replace(/\s+/g,'').replace(/[，、＋+和跟与]/g,';').replace(/\n/g,';');
  // Expand special non-canonical phrases and chinese numerals.
  const zh={'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
  txt=txt.replace(/([一二两三四五六七八九十])(?=个|颗|袋|包|根|罐|瓶)/g,(_,v)=>String(zh[v]));
  const fragments=txt.split(/[;；。:：]/).map(s=>s.trim()).filter(Boolean);
  for(const frag of fragments){
    if(/全天|总热量|总摄入/.test(frag)&&/\d+/.test(frag))continue;
    let m=meal;
    if(/午餐|中午/.test(frag))m='lunch';else if(/晚餐|晚上|睡前/.test(frag))m='dinner';else if(/早餐|早上/.test(frag))m='breakfast';else if(/加餐|下午/.test(frag))m='snack';
    const stripped=frag.replace(/^(?:早餐|午餐|晚餐|加餐|中午|下午|晚上|睡前|早上)(?:是|吃|加|了|有|为)?/,'');
    const indexed=FOOD_DB.flatMap(f=>[f.name,...f.aliases].filter(Boolean).map(alias=>({f,alias}))).sort((a,b)=>b.alias.length-a.alias.length);
    const match=indexed.find(x=>stripped.includes(x.alias));
    if(!stripped)continue;
    if(!match){unknown.push(frag);continue;}
    const {f,alias}=match;
    const before=stripped.slice(0,stripped.indexOf(alias)),after=stripped.slice(stripped.indexOf(alias)+alias.length);
    const rx=/(\d+(?:\.\d+)?)\s*(克|g|毫升|ml|个|颗|袋|包|瓶|根|罐)/i;
    const grams=Array.from(stripped.matchAll(/(\d+(?:\.\d+)?)\s*(g|克|ml|毫升)/gi));
    // When count and weight coexist ("三个大番茄750g"), prefer gram weight.
    let picked=grams.length?grams[grams.length-1]:after.match(rx)||before.match(rx)||stripped.match(rx);
    if(!picked && (f.unit==='g'||f.unit==='ml')){unknown.push(`${frag}（请写明重量或体积）`);continue;}
    let amount=picked?Number(picked[1]):1;
    const rawUnit=picked?picked[2]:(f.unit);
    const unit=/克|g/i.test(rawUnit)?'g':/毫升|ml/i.test(rawUnit)?'ml':/个|颗/.test(rawUnit)?'个':/袋|包/.test(rawUnit)?'袋':/瓶/.test(rawUnit)?'瓶':/根/.test(rawUnit)?'根':/罐/.test(rawUnit)?'罐':f.unit;
    if(unit!==f.unit){
      if(f.unit==='g'&&unit!=='g'){
        // Only convert to grams for foods where one-piece weight was recorded.
        const pieceGram={egg_whitewater:30,kiwi:85,meat_egg:60,egg:55,beef_patty:50};
        if(!pieceGram[f.id]){unknown.push(`${frag}（请用克数）`);continue;}
        amount*=pieceGram[f.id];
      }else if(f.unit==='ml'&&unit==='瓶'&&f.id==='tomato_juice')amount*=220;
      else if(f.unit==='ml'&&unit==='瓶'&&f.id==='green_juice')amount*=220;
      else if(f.unit!=='g'&&f.unit!=='ml'&&unit!==f.unit){unknown.push(`${frag}（单位不匹配）`);continue;}
    }
    if(!Number.isFinite(amount)||amount<=0||amount>10000){unknown.push(frag);continue;}
    items.push({id:uuid(),foodId:f.id,name:f.name,meal:m,amount,unit:f.unit,approx:!!f.approx,origin:'文字速记'});
  }
  return {items,unknown,recognizedOverride};
}

function makeChart(){const dates=daysBack(activeDate,14);const points=dates.map(d=>({d,w:Number.isFinite(data.weightHistory[d])?data.weightHistory[d]:getDay(data,d).weight})).filter(x=>Number.isFinite(x.w));

 const poly=points.map(p=>`${x(p.d).toFixed(1)},${y(p.w).toFixed(1)}`).join(' ');

${cardTitle('身体基准',actionLink('编辑','settings'))}<div class="profile-list"><div class="profile-stat"><span>基础计算体重</span><strong>${fmt(data.settings.baselineKg)} kg</strong></div><div class="profile-stat"><span>真实晨重目标区间</span><strong>${fmt(data.settings.goalMinKg)} – ${fmt(data.settings.goalMaxKg)} kg</strong></div><div class="profile-stat"><span>身高 · 年龄</span><strong>${fmt(data.settings.heightCm)} cm · ${data.settings.age} 岁</strong></div><div class="profile-stat"><span>基础代谢估算（Mifflin-St Jeor）</span><strong>${bmr(data.settings)} kcal / 天</strong></div></div>

}
function openQuick(meal='dinner'){
 openSheet(header('✦ 智能文字速记','无需网络，用常见食物名称与数量识别；不支持未知食物或图片自动识别。')+`<label class="field-label">直接粘贴今天的报餐内容</label><textarea class="input" id="quickText" autofocus placeholder="晚餐：燕麦50g；减醇1袋；白水蛋4个；大番茄750g；卤牛肉125g"></textarea><label class="field-label">默认餐次（未写餐次时）</label>${mealDropdown(meal)}<button id="previewQuick" class="plain-btn" style="width:100%;margin-top:15px">预览识别结果</button><div id="quickPreview"></div><div class="sheet-buttons"><button class="secondary-btn" data-close>取消</button><button class="primary-btn" id="saveQuick">确认加入今日</button></div>`);
 const draw=()=>{const txt=sheet.querySelector('#quickText').value, selected=sheet.querySelector('#mealField').value;const result=quickParse(txt,selected);sheet.querySelector('#quickPreview').innerHTML=`<div class="qty-card">${result.items.length?result.items.map(e=>`<div class="row" style="padding:6px 0"><span style="font-size:11px">${esc(e.name)} ${fmt(e.amount)}${esc(e.unit)} · ${MEALS.find(m=>m.id===e.meal).label}</span><b style="font-size:11px">${fmt(calcNutrition(e).kcal)} kcal</b></div>`).join(''):'<div class="small-meta">暂未识别到食物</div>'}${result.recognizedOverride!==null?`<div class="small-green" style="margin-top:9px">全天确认热量：${result.recognizedOverride} kcal</div>`:''}${result.unknown.length?`<div class="card-caption" style="color:#b37f5b">未识别，需另行手动补录：${esc(result.unknown.join('、'))}</div>`:''}</div>`;return result;};
 sheet.querySelector('#previewQuick').onclick=draw;
 sheet.querySelector('#saveQuick').onclick=()=>{const result=draw();if(!result.items.length&&result.recognizedOverride===null){showToast('没有可导入的记录');return;}mutate(()=>{const d=ensureDay();d.entries.push(...result.items);if(result.recognizedOverride!==null)d.calorieOverride=result.recognizedOverride});closeSheet();showToast(result.unknown.length?`成功导入 ${result.items.length} 项，另有未识别内容`:`成功导入 ${result.items.length} 项`);};
}
function openWeight(){const d=getDay(data,activeDate);openSheet(header('记录晨起体重','与基础计算体重分开。建议记录起床、排尿后且进食前的数值。')+`<label class="field-label">真实晨重 (kg)</label><input class="input" type="number" min="20" max="300" step="0.05" value="${d.weight??''}" id="weightValue" autofocus placeholder="例如 73.50"/><label class="field-label">排便情况</label><select class="input" id="poopValue"><option value="unspecified" ${d.poop==='unspecified'?'selected':''}>未说明</option><option value="before" ${d.poop==='before'?'selected':''}>排便前</option><option value="after" ${d.poop==='after'?'selected':''}>排便后</option></select><div class="sheet-buttons"><button class="secondary-btn" data-close>取消</button><button class="primary-btn" id="saveWeight">保存晨重</button></div>`);sheet.querySelector('#saveWeight').onclick=()=>{const w=num(sheet.querySelector('#weightValue').value);if(!(w>20&&w<300)){showToast('请输入有效晨重');return;}mutate(()=>{const day=ensureDay();day.weight=w;day.poop=sheet.querySelector('#poopValue').value;data.weightHistory[activeDate]=w;});closeSheet();showToast('已更新晨重（不改变固定的代谢计算基准）');};}
function openActivity(){const d=getDay(data,activeDate);openSheet(header('记录手环活动消耗','只填手表显示的“活动热量”，不要输入包含静息消耗的“总热量”。')+`<label class="field-label">活动消耗 (kcal)</label><input class="input" type="number" min="0" max="10000" id="activityValue" value="${d.activity??''}" autofocus/><div class="sheet-buttons"><button class="secondary-btn" data-close>取消</button><button class="primary-btn" id="saveActivity">保存运动消耗</button></div>`);sheet.querySelector('#saveActivity').onclick=()=>{const v=num(sheet.querySelector('#activityValue').value);if(v===null||v<0||v>10000){showToast('请输入有效活动热量');return;}mutate(()=>ensureDay().activity=v);closeSheet();showToast('已更新活动消耗');};}
function openOverride(meal=null){const d=getDay(data,activeDate);const existing=meal?(d.mealOverrides?.[meal]??''):(d.calorieOverride??'');const isMeal=!!meal;
openSheet(header(isMeal?'本餐热量校准':'全天热量校准',isMeal?'如果整餐估算比食物分项更可靠，可直接确认本餐总热量。':'例如你习惯说“全天直接按2000卡算”，可在这里确认最终总计。')+`<label class="field-label">${isMeal?'整餐':'全天'}确认热量 (kcal)</label><input type="number" class="input" id="overrideValue" value="${existing}" min="0" step="any" placeholder="留空表示取消校准" autofocus/><div class="info-box top-gap">食品清单仍会保留；营养成分继续由每项食物计算，校准热量不会凭空生成蛋白质或维生素数值。</div><div class="sheet-buttons"><button class="secondary-btn" data-close>取消</button><button class="primary-btn" id="saveOverride">保存校准</button></div>`);
 sheet.querySelector('#saveOverride').onclick=()=>{const raw=sheet.querySelector('#overrideValue').value,v=num(raw);if(v!==null&&(v<0||v>30000)){showToast('请输入有效热量');return;}mutate(()=>{const d=ensureDay();if(isMeal){if(v===null)delete d.mealOverrides[meal];else d.mealOverrides[meal]=v;}else d.calorieOverride=v;});closeSheet();showToast(v===null?'已取消校准':'已更新确认热量');};
}
function openSettings(){const s=data.settings;openSheet(header('调整身体基准','实际晨重与固定的代谢计算体重是两套独立数据。')+`<div class="input-grid">${[['baselineKg','基准体重 kg'],['heightCm','身高 cm'],['age','年龄'],['goalMinKg','目标下限 kg'],['goalMaxKg','目标上限 kg']].map(([k,title])=>`<div><label class="field-label">${title}</label><input class="input setting-val" data-key="${k}" type="number" step="any" min="1" value="${s[k]}"/></div>`).join('')}</div><div class="sheet-buttons"><button class="secondary-btn" data-close>取消</button><button class="primary-btn" id="saveSettings">保存基准</button></div>`);sheet.querySelector('#saveSettings').onclick=()=>{const updates={};for(const inp of sheet.querySelectorAll('.setting-val')){const n=num(inp.value);if(n===null||n<=0||n>400){showToast('检查基准数值');return;}updates[inp.dataset.key]=n;}if(updates.goalMinKg>updates.goalMaxKg){showToast('目标体重区间顺序有误');return;}mutate(()=>Object.assign(data.settings,updates));closeSheet();showToast('已更新身体基准');};}
function exportBackup(){const text=JSON.stringify(data,null,2),blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`轻衡-私人备份-${localDate()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);showToast('已生成 JSON 备份，请妥善保存');}
function openImport(){openSheet(header('导入历史备份','可选择附带的私人初始记录文件，或曾经由本应用导出的 JSON。导入会覆盖当前本机记录。')+`<div class="info-box">请只导入自己信任的 JSON 文件。导入前建议先导出当前记录作为备份。</div><label class="field-label">选择 .json 文件</label><input class="input" id="importFile" type="file" accept=".json,application/json"/><div id="importDesc" class="card-caption"></div><div class="sheet-buttons"><button class="secondary-btn" data-close>取消</button><button class="primary-btn" id="submitImport">确认导入</button></div>`);sheet.querySelector('#submitImport').onclick=async()=>{const file=sheet.querySelector('#importFile').files?.[0];if(!file){showToast('先选择文件');return;}if(file.size>2_000_000){showToast('备份文件太大');return;}let next;try{next=validateState(JSON.parse(await file.text()));}catch(e){showToast(`文件有误：${e.message}`);return;}if(!confirm(`确认覆盖本机所有记录？\n该文件包含 ${Object.keys(next.days).length} 天的记录。`))return;data=next;save();closeSheet();activeDate=localDate();render();showToast('历史记录导入成功');};}
function openFoodLibraryImport(){
 openSheet(header('导入食品营养库','这只会增加食品库，不会覆盖你的饮食、晨重和历史记录。')+
 `<div class="info-box">支持由「轻衡」导出的食品 JSON（格式 qingheng.foods.v2）。默认包含约334种常见食品，无需重复导入；本功能用于继续扩充食品与特定品牌。</div>`+
 `<label class="field-label">选择食品库 .json 文件</label><input class="input" type="file" id="foodImportFile" accept=".json,application/json"/>`+
 `<div class="sheet-buttons"><button class="secondary-btn" data-close>取消</button><button class="primary-btn" id="commitFoodImport">导入食品</button></div>`);
 sheet.querySelector('#commitFoodImport').onclick=async()=>{
  const file=sheet.querySelector('#foodImportFile').files?.[0];if(!file){showToast('请选择食品库 JSON');return;}
  if(file.size>2500000){showToast('文件超过2.5MB');return;}
  let list;
  try{const src=JSON.parse(await file.text());if(src.format!=='qingheng.foods.v2'||!Array.isArray(src.foods)||src.foods.length>3000)throw Error('不是有效的食品库 JSON');list=src.foods.map((x,i)=>normalizeFood(x,i));}
  catch(err){showToast(`导入失败：${err.message}`);return;}
  const ids=new Set(FOOD_DB.map(x=>x.id));let added=0;
  try{
   for(const f of list){if(ids.has(f.id)||ids.has('import_'+f.id))continue;f.id='import_'+f.id;ids.add(f.id);FOOD_DB.push(f);added++;}
   saveUserFoods();closeSheet();render();showToast(`已新增 ${added} 种食品（重复项跳过）`);
  }catch(err){showToast('本机存储空间不足，请先备份');}
 };
}
function exportUserFoodLibrary(){
 const items=FOOD_DB.filter(x=>x.id.startsWith('user_')||x.id.startsWith('import_'));
 const b=new Blob([JSON.stringify({format:'qingheng.foods.v2',version:localDate(),foods:items},null,2)],{type:'application/json'});
 const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`轻衡-自建食品库-${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);showToast(`已导出 ${items.length} 种自建食品`);
}
function reset(){if(confirm('这将清空本机所有饮食、晨重和设置，且无法撤销。确定继续？')){if(confirm('最后确认：你已经导出必要的备份了吗？')){data={...initState(),days:{},weightHistory:{}};save();tab='home';activeDate=localDate();render();showToast('本机数据已清空');}}}
const actions={
 'prev-date':()=>changeDate(-1),'next-date':()=>changeDate(1),'go-food':()=>{tab='food';render()},'add-food':a=>openFoodPicker(a.dataset.meal||'lunch'),
 'quick':()=>openQuick(),'custom':()=>openCustom(),'weight':()=>openWeight(),'activity':()=>openActivity(),
 'override':()=>openOverride(),'meal-override':a=>openOverride(a.dataset.meal),
 'delete':a=>{const entry=getDay(data,activeDate).entries.find(e=>e.id===a.dataset.id);if(entry&&confirm(`删除 ${entry.name}？`))mutate(()=>ensureDay().entries=ensureDay().entries.filter(e=>e.id!==a.dataset.id));},
 'settings':()=>openSettings(),'export':()=>exportBackup(),'import':()=>openImport(),'food-import':()=>openFoodLibraryImport(),'food-export':()=>exportUserFoodLibrary(),'reset':()=>reset()
};
main.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a&&actions[a.dataset.action])actions[a.dataset.action](a);});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;main.scrollTop=0;window.scrollTo(0,0);render()}));
document.querySelector('#addButton').onclick=()=>openFoodPicker('lunch');
document.querySelector('#menuButton').onclick=()=>{tab='profile';render();window.scrollTo(0,0)};
overlay.addEventListener('click',e=>{if(e.target===overlay||e.target.closest('[data-close]'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.classList.contains('hidden'))closeSheet()});
window.addEventListener('storage',e=>{if(e.key===STORE&&e.newValue){try{data=validateState(JSON.parse(e.newValue));render();}catch{}}});
let seenDate=localDate();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&seenDate!==localDate()){const prev=seenDate;seenDate=localDate();if(activeDate===prev){activeDate=seenDate;render();}showToast('已切换到新的一天');}});

render();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', {scope:'./'}).catch(err => console.warn('Offline setup failed:',err)));
}
</script>
